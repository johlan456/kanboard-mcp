[project]
name = "kanboard-mcp"
version = "0.1.0"
description = "Multi-tenant MCP server for self-hosted Kanboard, with per-user token passthrough."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agileworks Group" }]
keywords = ["kanboard", "mcp", "model-context-protocol", "kanban"]
dependencies = [
    # <4: header handling (get_http_headers include= behavior) is load-bearing
    # for auth — see auth.request_headers(). Re-verify before a major bump.
    "fastmcp>=3.4,<4",
    "kanboard>=1.1.8,<2",
]

[project.scripts]
kanboard-mcp = "kanboard_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanboard_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
